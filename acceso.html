<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Acceso administrador | Impulso</title><link rel="stylesheet" href="administrador.css?v=revision-1792554745220"><script src="acceso.js?v=revision-1792554745220" defer></script><link rel="stylesheet" href="galeria-admin.css?v=revision-1792554745220"><meta name="impulso-build" content="revision-1792554745220"><meta name="robots" content="noindex,nofollow"></head><body><main class="admin" style="max-width:650px"><a href="index.html">← Volver a Impulso Universitario</a><h1>Ingreso usuario</h1><div class="login-choices"><a href="acceso.html">Ingreso usuario</a><a href="http://localhost:5174/acceso-admin.html">Ingreso admin propietario</a></div><p>Entra desde cualquier computadora con tu correo principal o alternativo.</p><section class="admin-panel"><form id="login-password"><label>Correo registrado<input id="account-email" name="email" type="email" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password"></label><button class="button">Entrar con contraseña</button><button id="request-code" class="button" type="button">Recibir código en mi correo</button><button id="request-reset" type="button">Olvidé mi contraseña</button></form><form id="verify-code" hidden><label>Código de 6 dígitos enviado a tu correo<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button class="button">Entrar con código</button></form><form id="reset-password" hidden><label>Nueva contraseña (mínimo 12 caracteres)<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Repite la contraseña<input name="repeat" type="password" minlength="12" required autocomplete="new-password"></label><button class="button">Guardar nueva contraseña</button></form><p id="access-status" role="status"></p><small>Los códigos vencen en 10 minutos. Los enlaces de recuperación vencen en 15 minutos y funcionan una sola vez.</small></section></main></body></html>
